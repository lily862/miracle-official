<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="styles.css">
    <title>Seminar Experience</title>

</head>

<body>

    <div class="blob-container">
        <div class="blob color-1"></div>
        <div class="blob color-2"></div>
    </div>

    <div id="intro-layer" class="layer">
        <div class="breathing-circle"></div>
        <p class="tagline">PRESENTED BY [COMPANY]</p>
        <h1 class="main-title">A New<br><span>Perspective</span></h1>
        <button class="pulse-button" onclick="startExperience()">Unlock Session</button>
    </div>

    <div id="main-content" class="layer">
        <div class="content-card">
            <h2 class="reveal-title">Welcome to the Seminar</h2>
            <div class="divider"></div>
            <p class="reveal-text">
                The session is about to begin. Please silence your devices and prepare to engage with the upcoming
                presentation.
            </p>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
